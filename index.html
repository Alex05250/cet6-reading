<title>CET-6 学习站</title>
<style>
  :root { --bg:#f7f5f0; --card:#fff; --ink:#222; --mut:#6b6b6b; --line:#e3ded3; --accent:#1e4b8f; }
  * { box-sizing:border-box; }
  body { margin:0; padding:40px 16px 80px; background:var(--bg); color:var(--ink);
         font-family:Georgia,"Times New Roman","宋体",serif; line-height:1.7; }
  .wrap { max-width:720px; margin:0 auto; }
  header { text-align:center; margin-bottom:32px; }

  .navcard { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px 24px;
         margin-bottom:16px; display:flex; align-items:center; gap:20px; text-decoration:none; color:inherit;
         transition:box-shadow .15s ease, transform .1s ease; }
  .navcard:hover { box-shadow:0 6px 18px rgba(0,0,0,.08); transform:translateY(-2px); }
  .icon { font-size:38px; line-height:1; }
  .navcard h2 { font-family:"Segoe UI","Microsoft YaHei",sans-serif; font-size:18px; margin:0 0 6px; color:var(--accent); }
  .navcard p { font-family:"Segoe UI","Microsoft YaHei",sans-serif; font-size:13px; color:var(--mut); margin:0; }
  footer { color:var(--mut); font-size:12px; margin-top:32px; text-align:center;
         font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
</style>
