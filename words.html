<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30 天速通 · CET-6 核心词</title>
<style>
  :root { --bg:#f7f5f0; --card:#fff; --ink:#222; --mut:#6b6b6b; --line:#e3ded3;
          --accent:#1e4b8f; --soft:#eef3fa; --ok:#46A171; --warn:#D5803B; }
  * { box-sizing:border-box; }
  body { margin:0; padding:28px 14px 90px; background:var(--bg); color:var(--ink);
         font-family:Georgia,"Times New Roman","宋体",serif; line-height:1.6;
         -webkit-text-size-adjust:100%; }
  .wrap { max-width:860px; margin:0 auto; }
  .sans { font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  a { color:var(--accent); text-decoration:none; }

  /* header */
  header { text-align:center; margin-bottom:18px; }
  header h1 { font-family:"Segoe UI","Microsoft YaHei",sans-serif; font-size:23px;
              margin:6px 0 6px; color:var(--accent); letter-spacing:-.01em; }
  header p { font-size:13px; color:var(--mut); margin:0; }

  /* progress */
  .prog { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:14px 18px; margin-bottom:14px; }
  .prog .top { display:flex; justify-content:space-between; align-items:baseline;
               font-family:"Segoe UI","Microsoft YaHei",sans-serif; font-size:13px;
               color:var(--mut); margin-bottom:8px; }
  .prog .top b { font-size:19px; color:var(--accent); }
  .bar { height:9px; background:var(--soft); border-radius:99px; overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:var(--ok);
             border-radius:99px; transition:width .25s ease; }

  /* toolbar */
  .tools { position:sticky; top:0; z-index:9; background:var(--bg); padding:8px 0 10px;
           display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tools input[type=search] { flex:1 1 220px; min-width:0; padding:10px 14px; font-size:14px;
      border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink);
      font-family:"Segoe UI","Microsoft YaHei",sans-serif; outline:none; }
  .tools input[type=search]:focus { border-color:var(--accent); }
  .btn { padding:9px 14px; font-size:13px; border:1px solid var(--line); border-radius:10px;
         background:var(--card); color:var(--ink); cursor:pointer; white-space:nowrap;
         font-family:"Segoe UI","Microsoft YaHei",sans-serif; transition:background .15s, border-color .15s; }
  .btn:hover { border-color:var(--accent); }
  .btn.on { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* day groups */
  details.group { background:var(--card); border:1px solid var(--line); border-radius:12px;
                  margin-bottom:10px; overflow:hidden; }
  details.group > summary { list-style:none; cursor:pointer; padding:13px 16px; display:flex;
      align-items:center; gap:10px; font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  details.group > summary::-webkit-details-marker { display:none; }
  summary .dnum { font-weight:700; font-size:14px; color:var(--accent); background:var(--soft);
                  border-radius:8px; padding:6px 10px; white-space:nowrap; }
  summary .dmeta { flex:1; min-width:0; font-size:13px; color:var(--mut); }
  summary .dmeta em { font-style:normal; color:var(--ink); font-weight:600; }
  summary .dpct { font-size:12px; color:var(--mut); white-space:nowrap; }
  summary .dlink { font-size:12px; color:var(--accent); border:1px solid var(--line);
                   border-radius:7px; padding:4px 9px; white-space:nowrap; }
  summary .dlink:hover { border-color:var(--accent); background:var(--soft); }
  .mini { height:4px; background:var(--soft); border-radius:99px; overflow:hidden; width:64px; }
  .mini > i { display:block; height:100%; width:0; background:var(--ok); }

  /* word rows */
  .rows { border-top:1px solid var(--line); }
  .row { display:flex; align-items:flex-start; gap:10px; padding:8px 14px;
         border-bottom:1px solid #f0ece4; }
  .row:last-child { border-bottom:none; }
  .row .no { flex:0 0 40px; color:#b9b3a6; font-size:11px; padding-top:3px; text-align:right; }
  .row .main { flex:1; min-width:0; }
  .row .w { font-size:15px; font-weight:600; letter-spacing:.01em; }
  .row .ph { font-size:12px; color:var(--mut); margin-left:8px; font-weight:400; }
  .row .m { font-size:13px; color:#444; margin-top:1px; word-break:break-word; }
  .row .chips { margin-top:3px; }
  .row .chip { display:inline-block; font-size:11px; color:var(--warn); background:#fbebde;
               border-radius:6px; padding:1px 7px; margin-right:5px;
               font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  .row button { flex:0 0 30px; width:30px; height:30px; margin-top:1px; border-radius:50%;
                border:1px solid var(--line); background:var(--card); color:#c9c3b6;
                font-size:13px; cursor:pointer; line-height:1; }
  .row button:hover { border-color:var(--ok); color:var(--ok); }
  .row.done button { background:var(--ok); border-color:var(--ok); color:#fff; }
  .row.done .w, .row.done .m, .row.done .ph { opacity:.42; }
  mark { background:#ffe9a8; color:inherit; padding:0 1px; border-radius:2px; }

  /* search results */
  #hits .hithead { font-family:"Segoe UI","Microsoft YaHei",sans-serif; font-size:13px;
                   color:var(--mut); margin:4px 0 10px; }

  /* flash cards */
  #flash { display:none; }
  #flash.on { display:block; }
  .deck { background:var(--card); border:1px solid var(--line); border-radius:16px;
          min-height:250px; display:flex; flex-direction:column; align-items:center;
          justify-content:center; text-align:center; padding:32px 22px; cursor:pointer;
          user-select:none; transition:box-shadow .15s; }
  .deck:hover { box-shadow:0 6px 20px rgba(0,0,0,.06); }
  .deck .cw { font-size:32px; font-weight:700; letter-spacing:-.01em; }
  .deck .cp { font-size:14px; color:var(--mut); margin-top:6px; }
  .deck .cm { font-size:15px; color:#3a3a3a; margin-top:16px; line-height:1.7;
              max-width:560px; }
  .deck .tip { font-size:13px; color:#b9b3a6; margin-top:22px; }
  .deck .chips { margin-top:12px; }
  .deck .chip { display:inline-block; font-size:11px; color:var(--warn); background:#fbebde;
                border-radius:6px; padding:2px 8px; margin:3px 4px 0 0;
                font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  .cardbar { display:flex; gap:8px; justify-content:center; margin-top:12px; flex-wrap:wrap; }
  .cardbar .cnt { font-family:"Segoe UI","Microsoft YaHei",sans-serif; font-size:12px;
                  color:var(--mut); align-self:center; }

  footer { color:var(--mut); font-size:12px; margin-top:28px; text-align:center;
           font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  footer a { border-bottom:1px dotted var(--line); }

  @media (max-width:560px){
    .row .no { flex-basis:30px; }
    .row .w { font-size:14px; }
    .deck .cw { font-size:26px; }
    summary .dpct { display:none; }
  }
</style>
</head>

const TOTAL = 5556;
const LS = n => 'cet6-day-' + n;

/* ---------- 进度读写 ---------- */
let done = {};            // { day: Set(words) }
const owners = {};        // word -> [day...]
function loadAll(){
  done = {};
  DAYS.forEach(([d]) => {
    let o = {};
    try { o = JSON.parse(localStorage.getItem(LS(d)) || '{}') || {}; } catch(e){ o = {}; }
    done[d] = new Set(Object.keys(o).filter(k => o[k]));
  });
}
function saveDay(d){
  const o = {}; done[d].forEach(w => o[w] = true);
  try { localStorage.setItem(LS(d), JSON.stringify(o)); } catch(e){}
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 进度条 ---------- */
function doneCount(){ let n = 0; DAYS.forEach(([d]) => n += done[d].size); return n; }
function refreshProgress(){
  const n = doneCount();
  document.getElementById('pnum').textContent = n;
  document.getElementById('ppct').textContent = (100*n/TOTAL).toFixed(1) + '%';
  document.getElementById('pbar').style.width = (100*n/TOTAL).toFixed(2) + '%';
}
function dayCount(d){ return done[d].size; }

/* ---------- 词表骨架 ---------- */
const rendered = new Set();
function rowHtml(day, it){
  const [n, w, p, m, g, c] = it;
  const chips = (c && c.length) ? '<div class="chips">' + c.map(x => '<span class="chip">' + esc(x) + '</span>').join('') + '</div>' : '';
  const on = done[day].has(w);
  return '<div class="row' + (on ? ' done' : '') + '">'
    + '<div class="no">' + n + '</div>'
    + '<div class="main"><div><span class="w">' + esc(w) + '</span><span class="ph">' + esc(p) + '</span></div>'
    + '<div class="m">' + esc(m) + '</div>' + chips + '</div>'
    + '<button data-d="' + day + '" data-w="' + esc(w) + '" aria-label="标记已熟">' + (on ? '✓' : '○') + '</button>'
    + '</div>';
}
function buildList(){
  const host = document.getElementById('list');
  host.innerHTML = DAYS.map(([d, start, end, count, review]) => {
    const nd = dayCount(d);
    return '<details class="group" data-day="' + d + '">'
      + '<summary>'
      +   '<span class="dnum">Day ' + d + '</span>'
      +   '<span class="dmeta">No.' + start + '–' + end + ' · <em>' + nd + '</em>/' + count + ' 已熟'
      +     (review && review.length ? ' · 回顾 Day ' + review.join(' / ') : '') + '</span>'
      +   '<span class="mini"><i style="width:' + (100*nd/count).toFixed(1) + '%"></i></span>'
      +   '<a class="dlink" href="words/day' + String(d).padStart(2,'0') + '.html">独立页 →</a>'
      + '</summary>'
      + '<div class="rows" data-host="' + d + '"></div>'
      + '</details>';
  }).join('');
  host.querySelectorAll('details.group').forEach(el => {
    el.addEventListener('toggle', () => {
      if (!el.open) return;
      const d = +el.dataset.day;
      if (rendered.has(d)) return;
      const rec = DAYS.find(x => x[0] === d);
      el.querySelector('[data-host]').innerHTML = rec[5].map(it => rowHtml(d, it)).join('');
      rendered.add(d);
    });
  });
  host.querySelectorAll('summary .dlink').forEach(a => a.addEventListener('click', e => e.stopPropagation()));
  host.addEventListener('click', onToggleBtn);
}
function onToggleBtn(e){
  const b = e.target.closest('button[data-w]');
  if (!b) return;
  const d = +b.dataset.d, w = b.dataset.w;
  if (done[d].has(w)) done[d].delete(w); else done[d].add(w);
  saveDay(d);
  b.textContent = done[d].has(w) ? '✓' : '○';
  b.closest('.row').classList.toggle('done', done[d].has(w));
  refreshProgress();
  const rec = DAYS.find(x => x[0] === d);
  const sm = document.querySelector('details[data-day="' + d + '"] summary .dmeta');
  if (sm) sm.innerHTML = 'No.' + rec[1] + '–' + rec[2] + ' · <em>' + dayCount(d) + '</em>/' + rec[3] + ' 已熟'
    + (rec[4] && rec[4].length ? ' · 回顾 Day ' + rec[4].join(' / ') : '');
  const mi = document.querySelector('details[data-day="' + d + '"] summary .mini > i');
  if (mi) mi.style.width = (100*dayCount(d)/rec[3]).toFixed(1) + '%';
}

/* ---------- 搜索 ---------- */
const FLAT = [];
DAYS.forEach(([d, s, e, c, r, items]) => items.forEach(it => FLAT.push([d].concat(it))));
function hl(text, q){
  if (!q) return esc(text);
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}
function search(raw){
  const q = raw.trim().toLowerCase();
  const listEl = document.getElementById('list'), hitsEl = document.getElementById('hits');
  if (!q){ listEl.style.display = ''; hitsEl.innerHTML = ''; return; }
  listEl.style.display = 'none';
  const hits = FLAT.filter(r => r[2].toLowerCase().includes(q) || r[4].toLowerCase().includes(q) || (r[5] && r[5].toLowerCase().includes(q)));
  if (!hits.length){ hitsEl.innerHTML = '<div class="hithead">没有匹配「' + esc(raw.trim()) + '」的词</div>'; return; }
  const LIMIT = 300;
  const shown = hits.slice(0, LIMIT);
  hitsEl.innerHTML = '<div class="hithead">命中 ' + hits.length + ' 词'
    + (hits.length > LIMIT ? '（显示前 ' + LIMIT + ' 条）' : '') + '</div>'
    + '<div class="rows" style="background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden">'
    + shown.map(r => {
        const [d, n, w, p, m, g, c] = r;
        const on = done[d].has(w);
        const chips = (c && c.length) ? '<div class="chips">' + c.map(x => '<span class="chip">' + esc(x) + '</span>').join('') + '</div>' : '';
        return '<div class="row' + (on ? ' done' : '') + '">'
          + '<div class="no">' + n + '</div>'
          + '<div class="main"><div><span class="w">' + hl(w, q) + '</span><span class="ph">' + esc(p) + '</span></div>'
          + '<div class="m">' + hl(m, q) + '</div>' + chips + '</div>'
          + '<button data-d="' + d + '" data-w="' + esc(w) + '">' + (on ? '✓' : '○') + '</button>'
          + '<a class="dlink sans" style="font-size:11px;align-self:center" href="words/day' + String(d).padStart(2,'0') + '.html">D' + d + ' →</a>'
          + '</div>';
      }).join('')
    + '</div>';
  hitsEl.querySelectorAll('button[data-w]').forEach(b => b.addEventListener('click', ev => {
    onToggleBtn(ev);
    search(raw);
  }));
}

/* ---------- 闪卡 ---------- */
let deck = [], ci = 0, flipped = false, onlyWeak = false;
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function buildDeck(){
  deck = FLAT.filter(r => !onlyWeak || !done[r[0]].has(r[2]));
  if (!deck.length) deck = FLAT.slice();
  shuffle(deck); ci = 0; flipped = false; drawCard();
}
function drawCard(){
  if (!deck.length) return;
  const r = deck[ci % deck.length];
  const [d, n, w, p, m, g, c] = r;
  document.getElementById('fcw').textContent = w;
  document.getElementById('fcp').textContent = p + '  ·  Day ' + d;
  document.getElementById('fcm').innerHTML = flipped ? esc(m) : '';
  document.getElementById('fcc').innerHTML = flipped && c && c.length
    ? c.map(x => '<span class="chip">' + esc(x) + '</span>').join('') : '';
  document.getElementById('ftip').textContent = flipped ? '记得就点「已熟」，忘了点「不熟」' : '先在心里说出意思，再点卡片翻面';
  document.getElementById('fcnt').textContent = (ci % deck.length + 1) + ' / ' + deck.length + (onlyWeak ? '（仅未熟）' : '');
}
function next(mark){
  const r = deck[ci % deck.length];
  if (mark === true){ done[r[0]].add(r[2]); saveDay(r[0]); refreshProgress(); }
  if (mark === false){ done[r[0]].delete(r[2]); saveDay(r[0]); refreshProgress(); }
  ci++; flipped = false; drawCard();
}

/* ---------- 模式切换 ---------- */
function setMode(flash){
  document.getElementById('flash').classList.toggle('on', flash);
  document.getElementById('list').style.display = flash ? 'none' : '';
  document.getElementById('hits').innerHTML = '';
  document.getElementById('q').value = '';
  document.getElementById('mFlash').classList.toggle('on', flash);
  document.getElementById('mList').classList.toggle('on', !flash);
  if (flash) buildDeck();
}

/* ---------- 绑定 ---------- */
document.getElementById('q').addEventListener('input', e => {
  document.getElementById('flash').classList.remove('on');
  document.getElementById('mFlash').classList.remove('on');
  document.getElementById('mList').classList.add('on');
  search(e.target.value);
});
document.getElementById('mList').onclick = () => setMode(false);
document.getElementById('mFlash').onclick = () => setMode(true);
document.getElementById('clear').onclick = () => {
  if (!confirm('清空全部 30 天的打勾进度？此操作不可撤销。')) return;
  DAYS.forEach(([d]) => { done[d] = new Set(); saveDay(d); });
  rendered.clear(); buildList(); refreshProgress(); setMode(false);
};
document.getElementById('deck').onclick = () => { flipped = !flipped; drawCard(); };
document.getElementById('deck').onkeydown = e => { if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); flipped = !flipped; drawCard(); } };
document.getElementById('fYes').onclick = () => next(true);
document.getElementById('fNo').onclick = () => next(false);
document.getElementById('fShuffle').onclick = () => { shuffle(deck); ci = 0; flipped = false; drawCard(); };
document.getElementById('fWeak').onclick = () => {
  onlyWeak = !onlyWeak;
  document.getElementById('fWeak').textContent = onlyWeak ? '练全部' : '只练未熟';
  document.getElementById('fWeak').classList.toggle('on', onlyWeak);
  buildDeck();
};
document.addEventListener('keydown', e => {
  if (!document.getElementById('flash').classList.contains('on')) return;
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft'){ next(false); }
  if (e.key === 'ArrowRight'){ next(true); }
  if (e.key === ' '){ e.preventDefault(); flipped = !flipped; drawCard(); }
});

/* ---------- 启动 ---------- */
loadAll();
buildList();
refreshProgress();
document.getElementById('mList').classList.add('on');
</script>
</body>
</html>
