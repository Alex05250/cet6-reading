<head>

<title>Day 1 · CET-6 单词卡</title>
<style>
:root{

  --orange:#D5803B; --orangeSoft:#FBEBDE; --red:#E56458; --redSoft:#FCE9E7;
}
@media (prefers-color-scheme: dark){
  :root{--text:#FFFFFF; --sub:rgba(255,255,255,.65); --canvas:#191919; --soft:#202020;
  --soft2:#383836; --border:rgba(255,255,255,.20); --blue:#5E9FE8; --blueSoft:rgba(94,159,232,.12);
  --green:#72BC8F; --greenSoft:rgba(114,188,143,.12); --orange:#DE9255; --orangeSoft:rgba(222,146,85,.12);
  --red:#E97366; --redSoft:rgba(233,115,102,.12);}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:20px 24px 32px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.title{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.meta{font-size:14px;color:var(--sub);margin-top:4px}
.stat{font-size:14px;color:var(--sub);text-align:right}
.stat b{font-size:22px;color:var(--green);font-weight:700}
.bar{height:6px;border-radius:8px;background:var(--soft2);margin-top:14px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--green);transition:width .25s ease}
nav{display:flex;gap:8px;margin:20px 0 16px;flex-wrap:wrap}
nav button{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--border);background:var(--canvas);color:var(--text);font-size:15px;font-weight:500;cursor:pointer}
nav button[aria-selected="true"]{background:var(--blueSoft);border-color:var(--blue);color:var(--blue)}
nav button:focus-visible,.row button:focus-visible,.card:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hint{font-size:14px;color:var(--sub);background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.group{border:1px solid var(--border);border-radius:8px;margin-bottom:12px;overflow:hidden}
.group>summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:15px;background:var(--soft);list-style:none;display:flex;justify-content:space-between;gap:12px}
.group>summary::-webkit-details-marker{display:none}
.group>summary span{color:var(--sub);font-weight:500;font-size:13px}
.row{display:grid;grid-template-columns:44px 1fr 1.3fr 44px;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--border)}
.row .no{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.row .w{font-weight:600;font-size:16px;word-break:break-word}
.row .ph{font-size:12px;color:var(--sub);font-family:Menlo,Consolas,monospace;word-break:break-all}
.row .m{font-size:14px;color:var(--text)}
.row .chip{display:inline-block;font-size:11px;color:var(--blue);background:var(--blueSoft);border-radius:4px;padding:1px 6px;margin:4px 4px 0 0}
.row button{width:44px;height:44px;border-radius:8px;border:1px solid var(--border);background:var(--canvas);cursor:pointer;font-size:16px;color:var(--sub)}
.row.done{background:var(--greenSoft)}
.row.done button{border-color:var(--green);color:var(--green)}
.row.hide .m,.row.hide .chip{filter:blur(5px);transition:filter .15s}
.row.hide:hover .m,.row.hide:hover .chip,.row.hide.show .m,.row.hide.show .chip{filter:none}
.cardbox{display:flex;flex-direction:column;align-items:center;gap:16px}
.card{width:100%;max-width:560px;min-height:210px;border:1px solid var(--border);border-radius:12px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;cursor:pointer;text-align:center}
.card .cw{font-size:34px;font-weight:700;line-height:1.2;word-break:break-word}
.card .cp{font-size:14px;color:var(--sub);font-family:Menlo,Consolas,monospace}
.card .cm{font-size:17px;max-width:460px}
.card .tip{font-size:13px;color:var(--sub)}
.card .chip{font-size:12px;color:var(--blue);background:var(--blueSoft);border-radius:4px;padding:2px 8px;margin:2px}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.acts button{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--border);background:var(--canvas);color:var(--text);font-size:15px;cursor:pointer}
.acts .ok{border-color:var(--green);color:var(--green);background:var(--greenSoft)}
.acts .no{border-color:var(--orange);color:var(--orange);background:var(--orangeSoft)}
.counter{font-size:14px;color:var(--sub)}
.quiz{max-width:620px;margin:0 auto}
.q{font-size:15px;color:var(--sub);margin-bottom:6px}
.qw{font-size:30px;font-weight:700;margin-bottom:18px;word-break:break-word}
.opts{display:grid;gap:10px}
.opts button{min-height:48px;text-align:left;padding:10px 16px;border-radius:8px;border:1px solid var(--border);background:var(--canvas);color:var(--text);font-size:15px;cursor:pointer}
.opts button.right{border-color:var(--green);background:var(--greenSoft);color:var(--green)}
.opts button.wrong{border-color:var(--red);background:var(--redSoft);color:var(--red)}
.aid h3{font-size:15px;margin:22px 0 10px;font-weight:600}
.aid h3:first-child{margin-top:0}
.aid .box{border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:10px;background:var(--soft)}
.aid .head{font-weight:600;font-size:15px;margin-bottom:6px}
.aid .head em{font-style:normal;color:var(--blue)}
.aid .ws{font-size:14px;color:var(--text);line-height:1.7}
.aid .pair{font-size:14px;line-height:1.7}
.aid .pair b{font-weight:600}
.aid .pair span{color:var(--sub)}
.foot{margin-top:24px;font-size:13px;color:var(--sub);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.foot button{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--canvas);color:var(--sub);font-size:13px;cursor:pointer}
[hidden]{display:none !important}
@media (max-width:600px){
  .wrap{padding:16px 16px 28px}
  .title{font-size:22px}
  .row{grid-template-columns:1fr 44px;gap:6px}
  .row .no{display:none}
  .row .mcell{grid-column:1}
  .card .cw{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

const KEY = 'cet6-day-' + DATA.day;
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { done = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('ttl').textContent = 'Day ' + DATA.day + ' · 六级单词';
$('mta').textContent = 'No.' + DATA.start + '–' + DATA.end + ' · 共 ' + DATA.count + ' 词'
  + (DATA.review.length ? ' · 今日回顾 Day ' + DATA.review.join(' / ') : ' · 第一天，开工！');
$('tot').textContent = DATA.count;

function refresh(){
  const n = DATA.items.filter(it => done[it.w]).length;
  $('cnt').textContent = n;
  $('pbar').style.width = (100 * n / DATA.count).toFixed(1) + '%';
}

/* ---------- list ---------- */
const GROUP = 46;
let blurred = false;
function buildList(){
  const host = $('groups');
  host.innerHTML = '';
  for (let g = 0; g * GROUP < DATA.items.length; g++) {
    const part = DATA.items.slice(g * GROUP, (g + 1) * GROUP);
    const d = document.createElement('details');
    d.className = 'group';
    if (g === 0) d.open = true;
    const nd = part.filter(it => done[it.w]).length;
    d.innerHTML = '<summary>第 ' + (g + 1) + ' 组 · ' + part[0].w + ' → ' + part[part.length - 1].w
      + '<span>' + nd + '/' + part.length + ' 已熟 · 建议 25 分钟</span></summary>'
      + part.map(it => rowHtml(it)).join('');
    host.appendChild(d);
  }
  host.querySelectorAll('.row').forEach(r => r.addEventListener('click', e => {
    if (blurred && !e.target.closest('button')) r.classList.toggle('show');
  }));
  host.querySelectorAll('.row button').forEach(b => b.onclick = () => {
    const w = b.dataset.w;
    done[w] = !done[w];
    save();
    b.closest('.row').classList.toggle('done', !!done[w]);
    b.textContent = done[w] ? '✓' : '○';
    refresh();
  });
}
function rowHtml(it){
  const chips = (it.c || []).map(c => '<span class="chip">' + esc(c) + '</span>').join('');
  return '<div class="row' + (done[it.w] ? ' done' : '') + (blurred ? ' hide' : '') + '">'
    + '<div class="no">' + it.n + '</div>'
    + '<div><div class="w">' + esc(it.w) + '</div><div class="ph">' + esc(it.p) + '</div></div>'
    + '<div class="mcell"><div class="m">' + esc(it.m) + '</div>' + chips + '</div>'
    + '<button data-w="' + esc(it.w) + '" aria-label="标记已熟">' + (done[it.w] ? '✓' : '○') + '</button></div>';
}
$('blurBtn').onclick = () => {
  blurred = !blurred;
  $('blurBtn').textContent = blurred ? '显示释义' : '遮住释义';
  buildList();
};

/* ---------- flash cards ---------- */
let deck = DATA.items.slice(), ci = 0, flipped = false, onlyWeak = false;
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildDeck(){
  deck = DATA.items.filter(it => !onlyWeak || !done[it.w]);
  if (!deck.length) deck = DATA.items.slice();
  ci = 0; flipped = false; drawCard();
}
function drawCard(){
  const it = deck[ci % deck.length];
  $('cardCounter').textContent = (ci % deck.length + 1) + ' / ' + deck.length + (onlyWeak ? ' （仅未熟）' : '');
  $('theCard').innerHTML = flipped
    ? '<div class="cw">' + esc(it.w) + '</div><div class="cp">' + esc(it.p) + '</div><div class="cm">' + esc(it.m) + '</div>'
      + (it.c || []).map(c => '<span class="chip">' + esc(c) + '</span>').join('')
    : '<div class="cw">' + esc(it.w) + '</div><div class="cp">' + esc(it.p) + '</div><div class="tip">先在心里说出意思，再点击翻面</div>';
}
function next(mark){
  const it = deck[ci % deck.length];
  if (mark === true) { done[it.w] = true; save(); refresh(); }
  if (mark === false) { delete done[it.w]; save(); refresh(); }
  ci++; flipped = false; drawCard();
}
$('theCard').onclick = () => { flipped = !flipped; drawCard(); };
$('theCard').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flipped = !flipped; drawCard(); } };
$('btnOk').onclick = () => next(true);
$('btnNo').onclick = () => next(false);
$('btnShuffle').onclick = () => { shuffle(deck); ci = 0; flipped = false; drawCard(); };
$('btnOnlyWeak').onclick = () => { onlyWeak = !onlyWeak; $('btnOnlyWeak').textContent = onlyWeak ? '练全部' : '只练未熟'; buildDeck(); };

/* ---------- quiz ---------- */
let qs = [], qi = 0, score = 0;
function buildQuiz(){
  const pool = shuffle(DATA.items.slice());
  qs = pool.slice(0, Math.min(10, pool.length));
  qi = 0; score = 0; drawQuiz();
}
function drawQuiz(){
  if (qi >= qs.length) {
    $('qProg').textContent = '完成';
    $('qWord').textContent = score + ' / ' + qs.length + ' 正确';
    $('qOpts').innerHTML = '';
    $('qScore').textContent = score === qs.length ? '全对，可以收工了。' : '错的那几个去“卡片自测”再过一遍。';
    return;
  }
  const it = qs[qi];
  const others = shuffle(DATA.items.filter(x => x.w !== it.w)).slice(0, 3);
  const opts = shuffle([it].concat(others));
  $('qProg').textContent = '第 ' + (qi + 1) + ' / ' + qs.length + ' 题';
  $('qWord').textContent = it.w;
  $('qOpts').innerHTML = opts.map(o => '<button data-w="' + esc(o.w) + '">' + esc(o.g || o.m) + '</button>').join('');
  $('qScore').textContent = '当前得分 ' + score;
  $('qOpts').querySelectorAll('button').forEach(b => b.onclick = () => {
    const right = b.dataset.w === it.w;
    if (right) { score++; b.classList.add('right'); done[it.w] = true; }
    else {
      b.classList.add('wrong');
      delete done[it.w];
      $('qOpts').querySelectorAll('button').forEach(x => { if (x.dataset.w === it.w) x.classList.add('right'); });
    }
    save(); refresh();
    $('qOpts').querySelectorAll('button').forEach(x => x.disabled = true);
    setTimeout(() => { qi++; drawQuiz(); }, right ? 350 : 1100);
  });
}
$('qRestart').onclick = buildQuiz;

/* ---------- memory aids ---------- */
function buildAid(){
  let h = '';
  if (DATA.roots.length) {
    h += '<h3>一、同词根成组记（拆开看，一组一组吹）</h3>';
    h += DATA.roots.map(g => '<div class="box"><div class="head"><em>' + esc(g.root) + '</em> → ' + esc(g.mean)
      + '</div><div class="ws">' + g.words.map(esc).join(' · ') + '</div></div>').join('');
  }
  if (DATA.confuse.length) {
    h += '<h3>二、形近易混词（考试坐坑大户）</h3><div class="box">'
      + DATA.confuse.map(p => '<div class="pair"><b>' + esc(p.a) + '</b> <span>' + esc(p.am) + '</span> ↔ <b>'
        + esc(p.b) + '</b> <span>' + esc(p.bm) + '</span></div>').join('') + '</div>';
  }
  if (DATA.suffixes.length) {
    h += '<h3>三、后缀家族（看尾巴判词性）</h3>';
    h += DATA.suffixes.map(g => '<div class="box"><div class="head"><em>' + esc(g.suffix) + '</em> → ' + esc(g.mean)
      + '</div><div class="ws">' + g.words.map(esc).join(' · ') + '</div></div>').join('');
  }
  h += '<h3>四、今日回顾</h3><div class="box"><div class="ws">'
    + (DATA.review.length ? '回顾 Day ' + DATA.review.join('、Day ') + '：只看那些未打 ✓ 的词，每天 10 分钟就够。'
      : '今天是第一天，不用回顾，把节奏跑起来。') + '</div></div>';
  $('aid').innerHTML = h;
}

/* ---------- tabs ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
  ['list', 'card', 'quiz', 'aid'].forEach(id => $(id).hidden = (id !== b.dataset.t));
  if (b.dataset.t === 'card') buildDeck();
  if (b.dataset.t === 'quiz') buildQuiz();
});

$('expBtn').onclick = () => {
  const weak = DATA.items.filter(it => !done[it.w]);
  const txt = weak.map(it => it.w + ' ' + it.p + ' ' + it.m).join('\n');
  const out = $('expOut');
  if (navigator.clipboard && txt) {
    navigator.clipboard.writeText(txt).then(() => { out.textContent = '已复制 ' + weak.length + ' 个未熟词，可粘到错词本。'; },
      () => { out.textContent = '未熟 ' + weak.length + ' 词（浏览器禁止复制）'; });
  } else { out.textContent = '未熟 ' + weak.length + ' 词'; }
};
$('resetBtn').onclick = () => { done = {}; save(); refresh(); buildList(); $('expOut').textContent = '已清空。'; };

refresh(); buildList(); buildAid();
</script>
</body>
