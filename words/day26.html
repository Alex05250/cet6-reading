const KEY = 'cet6-day-' + DATA.day;
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { done = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('ttl').textContent = 'Day ' + DATA.day + ' · 六级单词';
$('mta').textContent = 'No.' + DATA.start + '–' + DATA.end + ' · 共 ' + DATA.count + ' 词'
  + (DATA.review.length ? ' · 今日回顾 Day ' + DATA.review.join(' / ') : ' · 第一天，开工！');
$('tot').textContent = DATA.count;

function refresh(){
  const n = DATA.items.filter(it => done[it.w]).length;
  $('cnt').textContent = n;
  $('pbar').style.width = (100 * n / DATA.count).toFixed(1) + '%';
}

/* ---------- list ---------- */
const GROUP = 46;
let blurred = false;
function buildList(){
  const host = $('groups');
  host.innerHTML = '';
  for (let g = 0; g * GROUP < DATA.items.length; g++) {
    const part = DATA.items.slice(g * GROUP, (g + 1) * GROUP);
    const d = document.createElement('details');
    d.className = 'group';
    if (g === 0) d.open = true;
    const nd = part.filter(it => done[it.w]).length;
    d.innerHTML = '<summary>第 ' + (g + 1) + ' 组 · ' + part[0].w + ' → ' + part[part.length - 1].w
      + '<span>' + nd + '/' + part.length + ' 已熟 · 建议 25 分钟</span></summary>'
      + part.map(it => rowHtml(it)).join('');
    host.appendChild(d);
  }
  host.querySelectorAll('.row').forEach(r => r.addEventListener('click', e => {
    if (blurred && !e.target.closest('button')) r.classList.toggle('show');
  }));
  host.querySelectorAll('.row button').forEach(b => b.onclick = () => {
    const w = b.dataset.w;
    done[w] = !done[w];
    save();
    b.closest('.row').classList.toggle('done', !!done[w]);
    b.textContent = done[w] ? '✓' : '○';
    refresh();
  });
}
function rowHtml(it){
  const chips = (it.c || []).map(c => '<span class="chip">' + esc(c) + '</span>').join('');
  return '<div class="row' + (done[it.w] ? ' done' : '') + (blurred ? ' hide' : '') + '">'
    + '<div class="no">' + it.n + '</div>'
    + '<div><div class="w">' + esc(it.w) + '</div><div class="ph">' + esc(it.p) + '</div></div>'
    + '<div class="mcell"><div class="m">' + esc(it.m) + '</div>' + chips + '</div>'
    + '<button data-w="' + esc(it.w) + '" aria-label="标记已熟">' + (done[it.w] ? '✓' : '○') + '</button></div>';
}
$('blurBtn').onclick = () => {
  blurred = !blurred;
  $('blurBtn').textContent = blurred ? '显示释义' : '遮住释义';
  buildList();
};

/* ---------- flash cards ---------- */
let deck = DATA.items.slice(), ci = 0, flipped = false, onlyWeak = false;
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildDeck(){
  deck = DATA.items.filter(it => !onlyWeak || !done[it.w]);
  if (!deck.length) deck = DATA.items.slice();
  ci = 0; flipped = false; drawCard();
}
function drawCard(){
  const it = deck[ci % deck.length];
  $('cardCounter').textContent = (ci % deck.length + 1) + ' / ' + deck.length + (onlyWeak ? ' （仅未熟）' : '');
  $('theCard').innerHTML = flipped
    ? '<div class="cw">' + esc(it.w) + '</div><div class="cp">' + esc(it.p) + '</div><div class="cm">' + esc(it.m) + '</div>'
      + (it.c || []).map(c => '<span class="chip">' + esc(c) + '</span>').join('')
    : '<div class="cw">' + esc(it.w) + '</div><div class="cp">' + esc(it.p) + '</div><div class="tip">先在心里说出意思，再点击翻面</div>';
}
function next(mark){
  const it = deck[ci % deck.length];
  if (mark === true) { done[it.w] = true; save(); refresh(); }
  if (mark === false) { delete done[it.w]; save(); refresh(); }
  ci++; flipped = false; drawCard();
}
$('theCard').onclick = () => { flipped = !flipped; drawCard(); };
$('theCard').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flipped = !flipped; drawCard(); } };
$('btnOk').onclick = () => next(true);
$('btnNo').onclick = () => next(false);
$('btnShuffle').onclick = () => { shuffle(deck); ci = 0; flipped = false; drawCard(); };
$('btnOnlyWeak').onclick = () => { onlyWeak = !onlyWeak; $('btnOnlyWeak').textContent = onlyWeak ? '练全部' : '只练未熟'; buildDeck(); };

/* ---------- quiz ---------- */
let qs = [], qi = 0, score = 0;
function buildQuiz(){
  const pool = shuffle(DATA.items.slice());
  qs = pool.slice(0, Math.min(10, pool.length));
  qi = 0; score = 0; drawQuiz();
}
function drawQuiz(){
  if (qi >= qs.length) {
    $('qProg').textContent = '完成';
    $('qWord').textContent = score + ' / ' + qs.length + ' 正确';
    $('qOpts').innerHTML = '';
    $('qScore').textContent = score === qs.length ? '全对，可以收工了。' : '错的那几个去“卡片自测”再过一遍。';
    return;
  }
  const it = qs[qi];
  const others = shuffle(DATA.items.filter(x => x.w !== it.w)).slice(0, 3);
  const opts = shuffle([it].concat(others));
  $('qProg').textContent = '第 ' + (qi + 1) + ' / ' + qs.length + ' 题';
  $('qWord').textContent = it.w;
  $('qOpts').innerHTML = opts.map(o => '<button data-w="' + esc(o.w) + '">' + esc(o.g || o.m) + '</button>').join('');
  $('qScore').textContent = '当前得分 ' + score;
  $('qOpts').querySelectorAll('button').forEach(b => b.onclick = () => {
    const right = b.dataset.w === it.w;
    if (right) { score++; b.classList.add('right'); done[it.w] = true; }
    else {
      b.classList.add('wrong');
      delete done[it.w];
      $('qOpts').querySelectorAll('button').forEach(x => { if (x.dataset.w === it.w) x.classList.add('right'); });
    }
    save(); refresh();
    $('qOpts').querySelectorAll('button').forEach(x => x.disabled = true);
    setTimeout(() => { qi++; drawQuiz(); }, right ? 350 : 1100);
  });
}
$('qRestart').onclick = buildQuiz;

  h += '<h3>四、今日回顾</h3><div class="box"><div class="ws">'
    + (DATA.review.length ? '回顾 Day ' + DATA.review.join('、Day ') + '：只看那些未打 ✓ 的词，每天 10 分钟就够。'
      : '今天是第一天，不用回顾，把节奏跑起来。') + '</div></div>';
  $('aid').innerHTML = h;
}

/* ---------- tabs ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
  ['list', 'card', 'quiz', 'aid'].forEach(id => $(id).hidden = (id !== b.dataset.t));
  if (b.dataset.t === 'card') buildDeck();
  if (b.dataset.t === 'quiz') buildQuiz();
});

$('expBtn').onclick = () => {
  const weak = DATA.items.filter(it => !done[it.w]);
  const txt = weak.map(it => it.w + ' ' + it.p + ' ' + it.m).join('\n');
  const out = $('expOut');
  if (navigator.clipboard && txt) {
    navigator.clipboard.writeText(txt).then(() => { out.textContent = '已复制 ' + weak.length + ' 个未熟词，可粘到错词本。'; },
      () => { out.textContent = '未熟 ' + weak.length + ' 词（浏览器禁止复制）'; });
  } else { out.textContent = '未熟 ' + weak.length + ' 词'; }
};
$('resetBtn').onclick = () => { done = {}; save(); refresh(); buildList(); $('expOut').textContent = '已清空。'; };

refresh(); buildList(); buildAid();
</script>
</body>
</html>
